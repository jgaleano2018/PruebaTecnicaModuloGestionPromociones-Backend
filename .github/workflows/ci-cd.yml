name: CI/CD Pipeline - Backend Gestión de Promociones

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:

  # ===========================================================================
  # 1. VALIDAR SECRETOS
  # ===========================================================================
  validate-secrets:
    name: Validar Variables de Entorno
    runs-on: ubuntu-latest

    steps:
      - name: Validar variables requeridas
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "Verificando variables requeridas..."

          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "::error::Falta el secreto DB_PASSWORD en GitHub Secrets."
            exit 1
          fi

          echo "✅ DB_PASSWORD está configurada."


  # ===========================================================================
  # 2. CALIDAD DE CÓDIGO
  # ===========================================================================
  code-quality:
    name: 1. Linter & Pruebas Unitarias
    needs: [validate-secrets]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter
        run: npm run lint

      - name: Ejecutar Suite de Tests Unitarios
        run: npm test -- --runInBand


  # ===========================================================================
  # 3. DOCKER + INTEGRATION SMOKE TEST
  # ===========================================================================
  smoke-test:
    name: 2. Build Docker & Smoke Test (/health)
    needs: [code-quality]
    runs-on: ubuntu-latest

    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
      NODE_OPTIONS: "--max-old-space-size=4096"

      DB_HOST: sqlserver
      DB_USER: sa
      DB_USERNAME: sa
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      MSSQL_SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SA_PASSWORD: ${{ secrets.DB_PASSWORD }}

      ACCEPT_EULA: "Y"

      DB_PORT: 1433
      DB_NAME: PromocionesDB

      PORT: 3000
      API_PREFIX: /api/v1

      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"

      # Para CI podemos permitir que TypeORM sincronice
      # si el proyecto está preparado para ello.
      DB_SYNCHRONIZE: "false"

    steps:

      # -----------------------------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------------------------
      - name: Checkout del repositorio
        uses: actions/checkout@v4


      # -----------------------------------------------------------------------
      # DOCKER BUILDX
      # -----------------------------------------------------------------------
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3


      # -----------------------------------------------------------------------
      # VALIDAR SECRET
      # -----------------------------------------------------------------------
      - name: Validar DB_PASSWORD
        run: |
          set -Eeuo pipefail

          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "::error::DB_PASSWORD está vacía."
            exit 1
          fi

          echo "✅ DB_PASSWORD disponible."


      # -----------------------------------------------------------------------
      # CREAR .ENV
      # -----------------------------------------------------------------------
      - name: Crear archivo .env para Docker Compose
        run: |
          set -Eeuo pipefail

          cat > .env <<EOF
          NODE_OPTIONS=${NODE_OPTIONS}
          DB_HOST=${DB_HOST}
          DB_USER=${DB_USER}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
          SA_PASSWORD=${SA_PASSWORD}
          ACCEPT_EULA=${ACCEPT_EULA}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          PORT=${PORT}
          API_PREFIX=${API_PREFIX}
          DB_ENCRYPT=${DB_ENCRYPT}
          DB_TRUST_SERVER_CERTIFICATE=${DB_TRUST_SERVER_CERTIFICATE}
          DB_SYNCHRONIZE=${DB_SYNCHRONIZE}
          EOF

          echo "✅ Archivo .env creado."


      # -----------------------------------------------------------------------
      # VALIDAR COMPOSE
      # -----------------------------------------------------------------------
      - name: Validar Docker Compose
        run: |
          set -Eeuo pipefail

          docker compose config > compose-resolved.yml

          echo "Docker Compose válido."

          echo "Servicios:"
          docker compose config --services


      # -----------------------------------------------------------------------
      # BUILD
      # -----------------------------------------------------------------------
      - name: Construir imágenes Docker
        run: |
          set -Eeuo pipefail

          echo "Descargando imágenes de SQL Server..."

          docker compose pull sqlserver db-init || true

          echo "Construyendo backend..."

          docker compose build --no-cache

          echo "✅ Build completado."


      # -----------------------------------------------------------------------
      # SQL SERVER
      # -----------------------------------------------------------------------
      - name: Iniciar SQL Server
        run: |
          set -Eeuo pipefail

          echo "Iniciando SQL Server..."

          docker compose up -d sqlserver

          echo "SQL Server iniciado."

          docker compose ps -a


      # -----------------------------------------------------------------------
      # ESPERAR SQL SERVER
      # -----------------------------------------------------------------------
      - name: Esperar SQL Server saludable
        run: |
          set -Eeuo pipefail

          echo "Esperando SQL Server..."

          MAX_ATTEMPTS=30

          for i in $(seq 1 $MAX_ATTEMPTS); do

            STATUS=$(docker inspect promociones_sqlserver \
              --format '{{.State.Health.Status}}' 2>/dev/null || echo "unknown")

            echo "Intento $i/$MAX_ATTEMPTS - SQL Server: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "✅ SQL Server saludable."
              exit 0
            fi

            sleep 5

          done

          echo "::error::SQL Server no llegó a healthy."

          docker compose ps -a || true

          echo "===== SQL SERVER LOGS ====="

          docker logs promociones_sqlserver --tail 300 || true

          echo "===== SQL SERVER HEALTH ====="

          docker inspect promociones_sqlserver \
            --format '{{json .State.Health}}' || true

          exit 1


      # -----------------------------------------------------------------------
      # DB INIT
      # -----------------------------------------------------------------------
      - name: Ejecutar inicialización de base de datos
        run: |
          set -Eeuo pipefail

          echo "Ejecutando db-init..."

          docker compose up -d db-init

          echo "Esperando db-init..."

          MAX_ATTEMPTS=30

          for i in $(seq 1 $MAX_ATTEMPTS); do

            STATUS=$(docker inspect promociones_db_init \
              --format '{{.State.Status}}' 2>/dev/null || echo "unknown")

            echo "Intento $i/$MAX_ATTEMPTS - db-init: $STATUS"

            if [ "$STATUS" = "exited" ]; then

              EXIT_CODE=$(docker inspect promociones_db_init \
                --format '{{.State.ExitCode}}')

              echo "db-init terminó con código: $EXIT_CODE"

              if [ "$EXIT_CODE" = "0" ]; then
                echo "✅ Base de datos inicializada correctamente."
                exit 0
              fi

              echo "::error::db-init terminó con código $EXIT_CODE."

              docker logs promociones_db_init --tail 300 || true

              exit 1
            fi

            sleep 2

          done

          echo "::error::db-init no terminó dentro del tiempo esperado."

          docker logs promociones_db_init --tail 300 || true

          exit 1


      # -----------------------------------------------------------------------
      # BACKEND
      # -----------------------------------------------------------------------
      - name: Iniciar Backend
        run: |
          set -Eeuo pipefail

          echo "Iniciando backend..."

          docker compose up -d backend

          echo "Backend iniciado."

          docker compose ps -a


      # -----------------------------------------------------------------------
      # ESPERAR BACKEND
      # -----------------------------------------------------------------------
      - name: Esperar Backend saludable
        run: |
          set -Eeuo pipefail

          echo "Esperando Backend..."

          MAX_ATTEMPTS=30

          for i in $(seq 1 $MAX_ATTEMPTS); do

            STATUS=$(docker inspect promociones_backend \
              --format '{{.State.Health.Status}}' 2>/dev/null || echo "unknown")

            echo "Intento $i/$MAX_ATTEMPTS - Backend: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "✅ Backend saludable."
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then

              echo "Backend reportado como unhealthy."
              echo "Esperaremos algunos intentos adicionales..."

            fi

            sleep 5

          done

          echo "=========================================="
          echo "::error::Backend no llegó a healthy."
          echo "=========================================="

          echo "===== DOCKER COMPOSE PS ====="

          docker compose ps -a || true

          echo "===== BACKEND LOGS ====="

          docker logs promociones_backend --tail 300 || true

          echo "===== BACKEND HEALTH ====="

          docker inspect promociones_backend \
            --format '{{json .State.Health}}' || true

          echo "===== BACKEND STATE ====="

          docker inspect promociones_backend \
            --format '{{.State.Status}} | ExitCode={{.State.ExitCode}} | Error={{.State.Error}}' \
            || true

          echo "===== SQL SERVER HEALTH ====="

          docker inspect promociones_sqlserver \
            --format '{{json .State.Health}}' || true

          echo "===== SQL SERVER LOGS ====="

          docker logs promociones_sqlserver --tail 300 || true

          echo "===== DB INIT LOGS ====="

          docker logs promociones_db_init --tail 300 || true

          exit 1


      # -----------------------------------------------------------------------
      # SMOKE TEST HTTP
      # -----------------------------------------------------------------------
      - name: Ejecutar Smoke Test /health
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "Smoke Test"
          echo "=========================================="

          URL="http://localhost:3000/api/v1/health"

          MAX_ATTEMPTS=10

          for i in $(seq 1 $MAX_ATTEMPTS); do

            echo "Intento $i/$MAX_ATTEMPTS..."

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --max-time 5 \
              --output response.json \
              --write-out "%{http_code}" \
              "$URL" || true)

            echo "HTTP Status: $HTTP_CODE"

            if [ -f response.json ]; then
              cat response.json
              echo ""
            fi

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Smoke test exitoso."
              exit 0
            fi

            sleep 3

          done

          echo "::error::Smoke test fallido."

          echo "===== RESPONSE ====="

          cat response.json 2>/dev/null || true

          echo "===== COMPOSE ====="

          docker compose ps -a || true

          echo "===== BACKEND LOGS ====="

          docker logs promociones_backend --tail 300 || true

          exit 1


      # -----------------------------------------------------------------------
      # LIMPIEZA
      # -----------------------------------------------------------------------
      - name: Detener y limpiar contenedores
        if: always()
        run: |
          echo "Limpiando entorno Docker..."

          docker compose down -v --remove-orphans || true

          echo "✅ Limpieza completada."