services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: promociones_sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es requerida}"

    ports:
      # Puerto 1434 en Windows -> 1433 dentro del contenedor
      # El puerto 1433 de Windows ya está siendo utilizado por
      # otro contenedor SQL Server.
      - "1434:1433"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

    volumes:
      - sqlserver_data:/var/opt/mssql

    networks:
      - promociones_net

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: promociones_db_init

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      ACCEPT_EULA: "Y"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es requerida}"

    volumes:
      - ./scripts/init-db.sql:/scripts/init-db.sql:ro

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        set -e

        echo "=============================================="
        echo "Inicializando base de datos PromocionesDB"
        echo "=============================================="

        echo "Esperando conexión con SQL Server..."

        CONNECTED=false

        for i in {1..30}; do

          if /opt/mssql-tools18/bin/sqlcmd \
            -S sqlserver \
            -U sa \
            -P "$$DB_PASSWORD" \
            -C \
            -Q "SELECT 1" > /dev/null 2>&1
          then
            echo "SQL Server disponible."
            CONNECTED=true
            break
          fi

          echo "SQL Server todavía no está disponible. Intento $$i/30..."
          sleep 2

        done

        if [ "$$CONNECTED" != "true" ]; then
          echo "ERROR: No fue posible conectarse a SQL Server después de 30 intentos."
          exit 1
        fi

        echo "Ejecutando scripts/init-db.sql..."

        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$DB_PASSWORD" \
          -C \
          -i /scripts/init-db.sql

        echo "=============================================="
        echo "Inicialización de base de datos completada."
        echo "=============================================="

    networks:
      - promociones_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: promociones-backend:latest
    container_name: promociones_backend
    restart: unless-stopped

    environment:
      PORT: "${PORT:-3000}"
      NODE_ENV: "production"
      API_PREFIX: "${API_PREFIX:-/api/v1}"

      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}"

      # Dentro de Docker se utiliza el nombre del servicio
      # y el puerto interno de SQL Server.
      DB_HOST: "${DB_HOST:-sqlserver}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_USER: "${DB_USER:-sa}"
      DB_USERNAME: "${DB_USER:-sa}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es requerida}"
      DB_NAME: "${DB_NAME:-PromocionesDB}"

      # La BD se crea/modifica mediante init-db.sql.
      DB_SYNCHRONIZE: "${DB_SYNCHRONIZE:-false}"
      DB_LOGGING: "${DB_LOGGING:-false}"
      DB_ENCRYPT: "${DB_ENCRYPT:-false}"
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-true}"

    ports:
      - "${PORT:-3000}:3000"

    depends_on:
      db-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - promociones_net

volumes:
  sqlserver_data:

networks:
  promociones_net:
    driver: bridge