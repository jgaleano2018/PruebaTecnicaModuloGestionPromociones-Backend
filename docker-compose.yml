services:

  # ============================================================
  # SQL SERVER
  # ============================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: promociones_sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es requerida}"

    ports:
      - "1434:1433"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

    networks:
      - promociones_net


  # ============================================================
  # DATABASE INITIALIZATION
  # ============================================================
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: promociones_db_init
    restart: "no"

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es requerida}"

    volumes:
      - ./scripts/init-db.sql:/scripts/init-db.sql:ro

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        set -e

        echo "=============================================="
        echo "Inicializando PromocionesDB"
        echo "=============================================="

        echo "Esperando SQL Server..."

        for i in $$(seq 1 30); do

          if /opt/mssql-tools18/bin/sqlcmd \
            -S sqlserver,1433 \
            -U sa \
            -P "$$MSSQL_SA_PASSWORD" \
            -C \
            -Q "SELECT 1" \
            > /dev/null 2>&1
          then
            echo "SQL Server disponible."
            break
          fi

          if [ "$$i" -eq 30 ]; then
            echo "ERROR: No fue posible conectarse a SQL Server."
            exit 1
          fi

          echo "Esperando SQL Server... intento $$i/30"
          sleep 2

        done

        echo "Ejecutando scripts/init-db.sql..."

        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver,1433 \
          -U sa \
          -P "$$MSSQL_SA_PASSWORD" \
          -C \
          -b \
          -i /scripts/init-db.sql

        echo "=============================================="
        echo "Inicialización de base de datos completada."
        echo "=============================================="

    networks:
      - promociones_net


  # ============================================================
  # BACKEND
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: promociones-backend:latest
    container_name: promociones_backend
    restart: unless-stopped

    environment:
      PORT: "${PORT:-3000}"
      NODE_ENV: "production"
      API_PREFIX: "${API_PREFIX:-/api/v1}"

      # Frontend
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"

      # SQL Server
      DB_HOST: "${DB_HOST:-sqlserver}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es requerida}"
      DB_NAME: "${DB_NAME:-PromocionesDB}"

      # TypeORM / SQL Server
      DB_SYNCHRONIZE: "${DB_SYNCHRONIZE:-false}"
      DB_LOGGING: "${DB_LOGGING:-false}"
      DB_ENCRYPT: "${DB_ENCRYPT:-false}"
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-true}"

    ports:
      - "${PORT:-3000}:3000"

    depends_on:
      db-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/v1/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - promociones_net


# ==============================================================
# VOLUMES
# ==============================================================
volumes:
  sqlserver_data:


# ==============================================================
# NETWORK
# ==============================================================
networks:
  promociones_net:
    driver: bridge