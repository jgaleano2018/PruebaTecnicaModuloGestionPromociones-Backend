services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: promociones_sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es requerida}"
      MSSQL_PID: "Express"

    ports:
      - "${DB_PORT:-1433}:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -N optional -Q 'SELECT 1' || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

    networks:
      - promociones_net


  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: promociones_db_init

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      ACCEPT_EULA: "Y"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es requerida}"

    volumes:
      - ./scripts/init-db.sql:/scripts/init-db.sql:ro

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        echo "Ejecutando script de inicialización de la base de datos..."
        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$DB_PASSWORD" \
          -C \
          -N optional \
          -i /scripts/init-db.sql

    networks:
      - promociones_net


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: promociones-backend:latest
    container_name: promociones_backend
    restart: unless-stopped

    environment:
      PORT: "${PORT:-3000}"
      NODE_ENV: production
      API_PREFIX: "${API_PREFIX:-/api/v1}"

      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}"

      DB_HOST: "${DB_HOST:-sqlserver}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_USER: "${DB_USER:-sa}"
      DB_USERNAME: "${DB_USER:-sa}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es requerida}"
      DB_NAME: "${DB_NAME:-PromocionesDB}"

      DB_SYNCHRONIZE: "${DB_SYNCHRONIZE:-true}"
      DB_LOGGING: "${DB_LOGGING:-false}"
      DB_ENCRYPT: "${DB_ENCRYPT:-false}"
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-true}"

    ports:
      - "${PORT:-3000}:3000"

    depends_on:
      db-init:
        condition: service_completed_successfully

    healthcheck:
      test: node -e "require('http').get('http://localhost:3000/api/v1/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - promociones_net


volumes:
  sqlserver_data:
    driver: local


networks:
  promociones_net:
    driver: bridge